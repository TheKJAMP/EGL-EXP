name: Sync Fork with Upstream

on:
  schedule:
    # Läuft alle 6 Stunden automatisch
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ermöglicht zusätzlich manuellen Start per Klick im Tab "Actions"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync all branches and tags from upstream
        run: |
          git remote add upstream https://github.com/Eglantine-Community/Eglantine.git
          git fetch upstream --tags
          git push origin 'refs/remotes/upstream/*:refs/heads/*' --force
          git push origin --tags --force
